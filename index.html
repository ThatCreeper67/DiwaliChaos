<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Diwali Chaos - A Festive Stealth & Adventure Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0914;
      color: #fff;
      font-family: 'Outfit', sans-serif;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1e1333 0%, #0d0914 100%);
    }
    canvas {
      box-shadow: 0 0 35px rgba(255, 153, 51, 0.25), 0 0 80px rgba(0, 0, 0, 0.8);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0d0914;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .diya-loader {
      width: 48px;
      height: 24px;
      background: #e67e22;
      border-radius: 0 0 24px 24px;
      position: relative;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(230, 126, 34, 0.5);
    }
    .diya-flame {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 22px;
      background: radial-gradient(circle at 50% 80%, #fff 10%, #f1c40f 40%, #e74c3c 90%);
      border-radius: 50% 50% 20% 20%;
      animation: flicker 0.6s infinite alternate ease-in-out;
      box-shadow: 0 0 15px #f39c12;
    }
    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
      100% { transform: translateX(-50%) scale(1.15) rotate(3deg); }
    }
    .loading-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: #ffb74d;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="loading-overlay">
    <div class="diya-loader">
      <div class="diya-flame"></div>
    </div>
    <div class="loading-text">LIGHTING DIYAS...</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
